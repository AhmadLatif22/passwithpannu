name: pass_with_pannu
description: Pass With Pannu driving lesson booking.
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.2.0
  firebase_messaging: ^15.1.6
  google_fonts: ^6.2.1
  intl: '>=0.19.0 <1.0.0'
  timezone: ^0.9.4
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/driving_intro.mp4

# Drop your logo at assets/images/logo.png (transparent PNG, ~1024px), then run:
#   dart run flutter_native_splash:create && dart run flutter_launcher_icons
flutter_native_splash:
  color: "#000000"
  image: assets/images/pwp_logo.png
  color_dark: "#000000"
  image_dark: assets/images/pwp_logo.png
  android_12:
    color: "#000000"
    image: assets/images/pwp_logo.png
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/pwp_logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/pwp_logo.png
  remove_alpha_ios: true
